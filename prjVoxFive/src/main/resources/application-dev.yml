    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-please-32bytes-long}
  bootstrap:
    admin:
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:Admin@12345678}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@school.local}