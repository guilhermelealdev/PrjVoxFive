spring:
  datasource:
    url: ${APP_DB_URL:jdbc:mysql://localhost:3306/db_voxFive?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC}
    username: ${APP_DB_USERNAME:root}
    password: ${APP_DB_PASSWORD:12345}
