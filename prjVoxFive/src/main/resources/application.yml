spring:
  application:
    name: prjVoxSeven
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework
  error:
    include-stack-trace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    issuer: prjVoxSeven
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    secret: ${APP_JWT_SECRET:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap:
    admin:
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
  rate-limit:
    login-max-requests-per-ip: 5
    login-window: PT1M
    register-max-requests-per-ip: 3
    register-window: PT1H
    refresh-max-requests-per-ip: 20
    refresh-window: PT1M