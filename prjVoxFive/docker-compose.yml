services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${APP_DB_PASSWORD:-changeme}
      MYSQL_DATABASE: db_voxFive
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - prj-vox-seven
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${APP_DB_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_DB_URL: jdbc:mysql://mysql:3306/db_voxFive?useTimezone=true&serverTimezone=UTC
      APP_DB_USERNAME: root
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-changeme}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
    ports:
      - "8080:8080"
    networks:
      - prj-vox-seven

networks:
  prj-vox-seven:
    driver: bridge

volumes:
  mysql-data: